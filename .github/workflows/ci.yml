name: release-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create temporary PR review input
        run: |
          review_root="$(mktemp -d)"
          case "$review_root" in
            /*) ;;
            *) exit 1 ;;
          esac
          mkdir -p "$review_root/repo"
          printf 'value = 1\n' > "$review_root/repo/review.py"
          printf '%s\n' \
            'diff --git a/review.py b/review.py' \
            'new file mode 100644' \
            'index 0000000..1234567' \
            '--- /dev/null' \
            '+++ b/review.py' \
            '@@ -0,0 +1 @@' \
            '+value = 1' > "$review_root/pr.diff"
          {
            printf 'PR_REVIEW_REPO=%s\n' "$review_root/repo"
            printf 'PR_REVIEW_DIFF=%s\n' "$review_root/pr.diff"
          } >> "$GITHUB_ENV"

      - name: Validate base and scenario Compose models
        run: |
          docker compose config --quiet
          for overlay in baseline rag-poisoning mcp-poisoning llm-injection custom; do
            docker compose -f compose.yaml -f "scenarios/${overlay}.compose.yaml" config --quiet
          done
          docker compose -f compose.yaml -f scenarios/pr-review.compose.yaml config --quiet
          docker compose -f compose.yaml -f providers/huggingface.compose.yaml config --quiet
          docker compose -f compose.yaml -f providers/lm-studio.compose.yaml config --quiet

      - name: Build the three native images once
        run: docker compose build

      - name: Run public tests in the agent image
        run: docker compose run --rm --no-deps -T --entrypoint python -v "$PWD/tests:/opt/adlc/tests:ro" agent -m unittest discover -s /opt/adlc/tests -v

      - name: Validate all fixed scenario fixtures
        run: docker compose run --rm --no-deps -T reset validate-scenarios

      - name: Prepare review snapshot and health-check repo-rag
        run: |
          docker compose -f compose.yaml -f scenarios/pr-review.compose.yaml run --rm --no-deps -T reset prepare-review
          docker compose -f compose.yaml -f scenarios/pr-review.compose.yaml up -d --wait repo-rag

      - name: Assert the resolved isolation model
        run: |
          docker compose --profile tools config --format json --no-path-resolution > /tmp/adlc-base.json
          for overlay in baseline rag-poisoning mcp-poisoning llm-injection custom; do
            docker compose --profile tools -f compose.yaml -f "scenarios/${overlay}.compose.yaml" config --format json --no-path-resolution > "/tmp/adlc-${overlay}.json"
          done
          docker compose --profile tools -f compose.yaml -f scenarios/pr-review.compose.yaml config --format json --no-path-resolution > /tmp/adlc-pr-review.json
          ADLC_MODEL_BASE_URL=https://attacker.example/v1 docker compose --profile tools -f compose.yaml -f providers/huggingface.compose.yaml config --format json --no-path-resolution > /tmp/adlc-huggingface.json
          docker compose --profile tools -f compose.yaml -f providers/lm-studio.compose.yaml config --format json --no-path-resolution > /tmp/adlc-lm-studio.json
          python3 - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          base = json.loads(Path("/tmp/adlc-base.json").read_text(encoding="utf-8"))
          custom = json.loads(Path("/tmp/adlc-custom.json").read_text(encoding="utf-8"))
          pr_review = json.loads(Path("/tmp/adlc-pr-review.json").read_text(encoding="utf-8"))
          huggingface = json.loads(Path("/tmp/adlc-huggingface.json").read_text(encoding="utf-8"))
          lm_studio = json.loads(Path("/tmp/adlc-lm-studio.json").read_text(encoding="utf-8"))
          expected_scenarios = ("baseline", "rag-poisoning", "mcp-poisoning", "llm-injection", "custom")
          resolved_scenarios = {
              scenario: json.loads(Path(f"/tmp/adlc-{scenario}.json").read_text(encoding="utf-8"))
              for scenario in expected_scenarios
          }
          services = base["services"]
          core = {"reset", "repo-rag", "hf-gateway", "agent"}
          expected_services = core | {"setup-token"}
          expected_volumes = {"workspace", "corpus", "rag_index"}
          if set(services) != expected_services or set(base.get("volumes", {})) != expected_volumes:
              raise SystemExit("unexpected lab roles or volumes")
          if set(base.get("networks", {})) != {"internal", "egress"} or not base["networks"]["internal"].get("internal"):
              raise SystemExit("unexpected lab networks")
          if set(base.get("secrets", {})) != {"hf_token"}:
              raise SystemExit("unexpected lab secrets")

          reference = copy.deepcopy(base)
          reference["services"]["reset"].get("environment", {}).pop("LAB_SCENARIO", None)
          for scenario, resolved in resolved_scenarios.items():
              selected = resolved["services"]["reset"].get("environment", {}).get("LAB_SCENARIO")
              if selected != scenario:
                  raise SystemExit(f"scenario overlay mismatch: {scenario!r} selected {selected!r}")
              normalized = copy.deepcopy(resolved)
              normalized["services"]["reset"].get("environment", {}).pop("LAB_SCENARIO", None)
              binds = [mount for mount in normalized["services"]["reset"].get("volumes", []) if mount.get("type") == "bind"]
              if scenario == "custom":
                  if len(binds) != 1:
                      raise SystemExit("custom overlay bind count mismatch")
                  normalized["services"]["reset"]["volumes"].remove(binds[0])
              elif binds:
                  raise SystemExit(f"unexpected bind in {scenario!r}")
              if normalized != reference:
                  raise SystemExit(f"overlay changes more than its scenario fixture: {scenario!r}")

          build_targets = {
              service["build"]["target"]
              for service in services.values()
              if isinstance(service.get("build"), dict)
          }
          if build_targets != {"agent-runtime", "repo-rag", "hf-gateway"}:
              raise SystemExit("unexpected image targets")
          if not (services["agent"]["image"] == services["reset"]["image"] == services["setup-token"]["image"]):
              raise SystemExit("agent utility image is not shared")
          if services["agent"].get("environment") != {
              "ADLC_MCP_URL": "http://repo-rag:8000/mcp",
              "ADLC_LLM_URL": "http://hf-gateway:8080/v1/chat/completions",
          }:
              raise SystemExit("agent endpoint boundary mismatch")

          for name, service in services.items():
              networks = set(service.get("networks", {}))
              secrets = {
                  item.get("source") if isinstance(item, dict) else item
                  for item in service.get("secrets", [])
              }
              if ("egress" in networks) != (name == "hf-gateway"):
                  raise SystemExit(f"egress mismatch for {name}")
              if secrets != ({"hf_token"} if name == "hf-gateway" else set()):
                  raise SystemExit(f"secret mismatch for {name}")
              if service.get("ports") or service.get("privileged"):
                  raise SystemExit(f"unsafe service setting for {name}")
              mounts = service.get("volumes", [])
              if "docker.sock" in json.dumps(mounts, sort_keys=True):
                  raise SystemExit(f"host socket mounted by {name}")
          if any(services[name].get("user") != "10001:10001" for name in core):
              raise SystemExit("core role is not non-root")
          if services["setup-token"].get("user") != "0:0":
              raise SystemExit("setup-token user mismatch")
          if services["reset"].get("network_mode") != "none" or services["setup-token"].get("network_mode") != "none":
              raise SystemExit("offline utility network mismatch")

          base_binds = [
              (name, mount)
              for name, service in services.items()
              for mount in service.get("volumes", [])
              if mount.get("type") == "bind"
          ]
          if len(base_binds) != 1 or base_binds[0][0] != "setup-token" or base_binds[0][1].get("target") != "/host-lab":
              raise SystemExit("unexpected base host bind")
          custom_binds = [mount for mount in custom["services"]["reset"].get("volumes", []) if mount.get("type") == "bind"]
          if (
              len(custom_binds) != 1
              or custom_binds[0].get("target") != "/opt/adlc/scenarios/custom/payload.txt"
              or not custom_binds[0].get("read_only")
          ):
              raise SystemExit("custom payload bind mismatch")

          expected_review_binds = {
              (os.environ["PR_REVIEW_REPO"], "/input/repo"),
              (os.environ["PR_REVIEW_DIFF"], "/input/pr.diff"),
          }
          review_binds = [
              mount
              for mount in pr_review["services"]["reset"].get("volumes", [])
              if mount.get("type") == "bind"
          ]
          if (
              len(review_binds) != 2
              or {(mount.get("source"), mount.get("target")) for mount in review_binds} != expected_review_binds
              or any(not mount.get("read_only") for mount in review_binds)
          ):
              raise SystemExit("PR review input bind mismatch")
          if pr_review["services"]["repo-rag"].get("environment") != {"ADLC_PR_REVIEW_MODE": "1"}:
              raise SystemExit("PR review mode environment mismatch")
          expected_review_security = {
              name: [*base["services"][name].get("security_opt", []), "label=disable"]
              for name in ("reset", "repo-rag", "agent")
          }
          if {
              name: pr_review["services"][name].get("security_opt", [])
              for name in expected_review_security
          } != expected_review_security:
              raise SystemExit("PR review shared-volume SELinux compatibility mismatch")

          expected_review_named_mounts = {
              ("reset", "workspace", "/target/workspace"): False,
              ("reset", "corpus", "/target/corpus"): False,
              ("reset", "rag_index", "/target/rag-index"): False,
              ("repo-rag", "corpus", "/target/corpus"): True,
              ("repo-rag", "rag_index", "/target/rag-index"): True,
              ("agent", "workspace", "/target/workspace"): True,
              ("agent", "corpus", "/target/corpus"): True,
              ("agent", "rag_index", "/target/rag-index"): True,
          }

          def named_mounts(model):
              return {
                  (service_name, mount.get("source"), mount.get("target")): mount
                  for service_name, service in model["services"].items()
                  for mount in service.get("volumes", [])
                  if mount.get("type") == "volume"
              }

          base_named_mounts = named_mounts(base)
          review_named_mounts = named_mounts(pr_review)
          if set(review_named_mounts) != set(expected_review_named_mounts):
              raise SystemExit("PR review named mount set mismatch")
          for key, expected_read_only in expected_review_named_mounts.items():
              base_mount = base_named_mounts.get(key)
              review_mount = review_named_mounts[key]
              if base_mount is None or review_mount.get("read_only", False) != expected_read_only:
                  raise SystemExit(f"PR review named mount access mismatch: {key!r}")
              if review_mount.get("read_only", False) != base_mount.get("read_only", False):
                  raise SystemExit(f"PR review named mount changed access: {key!r}")
              if review_mount.get("bind"):
                  raise SystemExit(f"PR review named mount has unsupported bind options: {key!r}")

          normalized_review = copy.deepcopy(pr_review)
          normalized_review["services"]["reset"]["volumes"] = [
              mount
              for mount in normalized_review["services"]["reset"].get("volumes", [])
              if mount.get("type") != "bind"
          ]
          normalized_review["services"]["repo-rag"].pop("environment", None)
          for service_name in expected_review_security:
              normalized_review["services"][service_name]["security_opt"] = copy.deepcopy(
                  base["services"][service_name].get("security_opt", [])
              )
          if normalized_review != base:
              raise SystemExit("PR review overlay changes more than its two inputs, mode flag, and SELinux compatibility setting")

          local_gateway = lm_studio["services"]["hf-gateway"]
          local_agent = lm_studio["services"]["agent"]
          hf_gateway = huggingface["services"]["hf-gateway"]
          if hf_gateway.get("environment") != {
              "ADLC_HF_BASE_MODEL": "openai/gpt-oss-20b",
              "ADLC_HF_PROVIDER": "groq",
              "ADLC_MODEL_AUTH_MODE": "required",
              "ADLC_MODEL_BACKEND": "huggingface",
              "ADLC_MODEL_ID": "openai/gpt-oss-20b:groq",
              "ADLC_MODEL_OWNER": "groq",
              "ADLC_MODEL_REQUIRE_TOOLS": "true",
              "ADLC_MODEL_SECRET_PATH": "/run/secrets/hf_token",
          }:
              raise SystemExit("Hugging Face profile or pinned route mismatch")
          if local_gateway.get("secrets"):
              raise SystemExit("LM Studio gateway must not mount the Hugging Face credential")
          if local_gateway.get("environment") != {
              "ADLC_MODEL_AUTH_MODE": "none",
              "ADLC_MODEL_BACKEND": "lmstudio",
              "ADLC_MODEL_BASE_URL": "http://host.docker.internal:1234/v1",
              "ADLC_MODEL_ID": "gemma-4-e4b-uncensored-hauhaucs-aggressive",
              "ADLC_MODEL_OWNER": "lmstudio",
              "ADLC_MODEL_REQUIRE_TOOLS": "true",
          }:
              raise SystemExit("LM Studio gateway profile mismatch")
          if local_agent.get("environment") != {
              "ADLC_DEFENSE_PROFILE": "baseline",
              "ADLC_LLM_URL": "http://hf-gateway:8080/v1/chat/completions",
              "ADLC_MCP_URL": "http://repo-rag:8000/mcp",
              "ADLC_MODEL_ID": "gemma-4-e4b-uncensored-hauhaucs-aggressive",
              "ADLC_MODEL_PROFILE": "lmstudio-local",
          }:
              raise SystemExit("LM Studio agent profile mismatch")
          if local_agent.get("secrets") or set(local_agent.get("networks", {})) != {"internal"}:
              raise SystemExit("LM Studio agent must remain credential-free and internal-only")
          if not any("host.docker.internal" in item for item in local_gateway.get("extra_hosts", [])):
              raise SystemExit("LM Studio gateway has no pinned host route")

          root = Path(".")
          retired = "open" + "code"
          if any(retired in path.name.lower() for path in root.rglob("*")):
              raise SystemExit("retired runtime artifact remains")
          if any(
              path.is_file()
              and retired in path.read_text(encoding="utf-8", errors="ignore").lower()
              for path in root.rglob("*")
              if "__pycache__" not in path.parts and path.suffix != ".pyc"
          ):
              raise SystemExit("retired runtime terminology remains")
          PY

      - name: Remove temporary project resources
        if: always()
        run: docker compose down -v --remove-orphans
