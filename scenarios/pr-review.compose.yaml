services:
  reset:
    security_opt:
      - label=disable
    volumes:
      - type: bind
        source: ${PR_REVIEW_REPO:?PR_REVIEW_REPO must be an absolute checkout path}
        target: /input/repo
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PR_REVIEW_DIFF:?PR_REVIEW_DIFF must be an absolute unified diff path}
        target: /input/pr.diff
        read_only: true
        bind:
          create_host_path: false
      - workspace:/target/workspace
      - corpus:/target/corpus
      - rag_index:/target/rag-index

  repo-rag:
    security_opt:
      - label=disable
    environment:
      ADLC_PR_REVIEW_MODE: "1"
    volumes:
      - corpus:/target/corpus:ro
      - rag_index:/target/rag-index:ro

  agent:
    security_opt:
      - label=disable
    volumes:
      - workspace:/target/workspace:ro
      - corpus:/target/corpus:ro
      - rag_index:/target/rag-index:ro
